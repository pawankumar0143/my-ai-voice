
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI Voice Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101323;color:white;font-family:Arial,sans-serif}
main{max-width:700px;margin:25px auto;background:#1c2036;padding:25px;border-radius:18px}
h1{text-align:center;color:#b3a5ff}
p{text-align:center;color:#c6c8dc}
label{display:block;margin:20px 0 8px;font-weight:bold}
textarea,select{width:100%;padding:13px;border-radius:9px;border:1px solid #505779;background:#111629;color:white;font-size:16px}
textarea{height:190px;line-height:1.6}
button,.download{display:block;width:100%;padding:14px;margin-top:15px;border:0;border-radius:9px;background:#a99bff;color:#111323;font-size:16px;font-weight:bold;text-align:center;text-decoration:none;cursor:pointer}
button:disabled{opacity:.6}
.download{background:#a6efc0}
audio{width:100%;margin-top:20px}
#status{overflow-wrap:anywhere;margin-top:16px;text-align:center}
</style>
</head>
<body>
<main>
<h1>🎙️ My AI Voice Studio</h1>
<p>Hindi & English AI Voice Generator</p>

<label for="script">Apna YouTube script likho</label>
<textarea id="script" placeholder="Yahan script likho..."></textarea>

<label for="language">Language select karo</label>
<select id="language">
<option value="hi">Hindi</option>
<option value="en">English (India)</option>
</select>

<label for="gender">Voice select karo</label>
<select id="gender">
<option value="female">Female Voice</option>
<option value="male">Male Voice</option>
</select>

<button id="generate">🎙️ Generate Voice</button>
<div id="status" role="status">Script likho aur Generate Voice dabao.</div>

<audio id="player" controls hidden></audio>
<a id="download" class="download" download="my-ai-voice.mp3" hidden>⬇️ Download MP3</a>
</main>

<script>
const scriptBox=document.getElementById("script");
const language=document.getElementById("language");
const gender=document.getElementById("gender");
const button=document.getElementById("generate");
const statusBox=document.getElementById("status");
const player=document.getElementById("player");
const download=document.getElementById("download");
let audioUrl=null;

button.addEventListener("click",async()=>{
  const text=scriptBox.value.trim();
  if(!text){
    statusBox.textContent="Pehle apna script likho.";
    return;
  }
  button.disabled=true;
  statusBox.textContent="Voice generate ho rahi hai...";
  player.hidden=true;
  download.hidden=true;

  try{
    const response=await fetch("/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        text:text,
        voice:language.value+"-"+gender.value
      })
    });

    if(!response.ok){
      const err=await response.json();
      throw new Error(err.error||"Voice generate nahi hui.");
    }

    const blob=await response.blob();
    if(audioUrl)URL.revokeObjectURL(audioUrl);
    audioUrl=URL.createObjectURL(blob);

    player.src=audioUrl;
    download.href=audioUrl;
    player.hidden=false;
    download.hidden=false;
    statusBox.textContent="Voice ready! Play ya Download MP3 karo.";
  }catch(error){
    statusBox.textContent=error.message+" Terminal mein error bhi check karo.";
  }finally{
    button.disabled=false;
  }
});
</script>
</body>
</html>
